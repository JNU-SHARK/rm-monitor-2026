      DSN: postgres://rm_monitor:rm_monitor@10.43.83.22:5432/rm_monitor?sslmode=disable
      AutoMigrate: false
    TranscodeConf:
      BaseDir: /records
      SourceRetentionDays: 7
      EncoderPreset: "8"
      EncoderParams: "lp=4"
