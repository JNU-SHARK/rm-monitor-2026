apiVersion: v1
kind: ConfigMap
metadata:
  name: transcode-dispatcher-config
data:
  config.yml: |
    PostgresConf:
      DSN: postgres://rm_monitor:rm_monitor@10.43.83.22:5432/rm_monitor?sslmode=disable
      AutoMigrate: true
    TranscodeConf:
      BaseDir: /records
      DisableTranscode: true
      AllowedWindow: "23:00-06:00"
      SuspendWhenRecordingActive: true
      SourceRetentionDays: 7
      Concurrency: 2
      CPURequest: "500m"
      MemoryRequest: "2Gi"
      MemoryLimit: "8Gi"
    K8sJobConf:
      Namespace: rm-monitor
      Image: rm-monitor/transcode-job:latest
      ConfigMapName: transcode-job-config
      ServiceAccountName: rm-monitor-dispatcher
      RecordsPVC: rm-monitor-records
      RecordsMountPath: /records
      ImagePullPolicy: IfNotPresent
      TTLSecondsAfterFinished: 86400
---
apiVersion: v1
kind: ConfigMap
metadata:
