  config.yml: |
    PostgresConf:
      DSN: postgres://rm_monitor:rm_monitor@10.43.83.22:5432/rm_monitor?sslmode=disable
      AutoMigrate: true
    RedisConf:
      Host: 10.43.61.177:6379
      Type: node
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lark-notifier-config
data:
  config.yml: |
    LarkConf:
      AppId: ""
      AppSecret: ""
    RedisConf:
      Host: 10.43.61.177:6379
      Pass: ""
    PostgresConf:
      DSN: postgres://rm_monitor:rm_monitor@10.43.83.22:5432/rm_monitor?sslmode=disable
      AutoMigrate: true
    RecordConf:
      BaseDir: /records
    UploadConf:
      DisableFileUpload: true
      Concurrency: 1
      PartRetries: 3
      RetryBackoff: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: record-dispatcher-config
data:
  config.yml: |
    PostgresConf:
      DSN: postgres://rm_monitor:rm_monitor@10.43.83.22:5432/rm_monitor?sslmode=disable
      AutoMigrate: true
    RecordConf:
      Res: high
      BaseDir: /records
      PathTemplate: "{{.Event}}/{{.Zone}}/{{.MatchName}}/{{.Role}}.flv"
      MatchDirTemplate: "{{.Event}}/{{.Zone}}/{{.MatchName}}"
      MatchNameTemplate: "{{.Order}}. {{.RedSchool}}-{{.RedName}} VS {{.BlueSchool}}-{{.BlueName}}"
    K8sJobConf:
      Namespace: rm-monitor
      Image: rm-monitor/record-job:latest
      ConfigMapName: record-job-config
      ServiceAccountName: rm-monitor-dispatcher
      RecordsPVC: rm-monitor-records
      RecordsMountPath: /records
      ImagePullPolicy: IfNotPresent
      TTLSecondsAfterFinished: 86400
    ManifestJobConf:
      Namespace: rm-monitor
      Image: rm-monitor/manifest-job:latest
      ConfigMapName: manifest-job-config
      ServiceAccountName: rm-monitor-dispatcher
      RecordsPVC: rm-monitor-records
      RecordsMountPath: /records
      ImagePullPolicy: IfNotPresent
      TTLSecondsAfterFinished: 86400
---
